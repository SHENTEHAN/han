<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>恭喜發財</title>
  <meta name="description" content="拍發票就自動記帳＋對獎">
  <meta name="theme-color" content="#c62828">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="恭喜發財">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>恭喜發財</span>
    </div>
    <span id="engine-badge" class="engine-badge" hidden></span>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>

  <nav class="tabbar" aria-label="主要分頁">
    <button data-tab="scan" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 12h10"/></svg>
      <span>掃描</span>
    </button>
    <button data-tab="ledger" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-3-2-3 2-3-2-3 2-2-1.5V4a1 1 0 0 1 1-1zM9 8h6M9 12h6"/></svg>
      <span>帳本</span>
    </button>
    <button data-tab="lottery" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v4a4 4 0 0 1-8 0V4zM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 12v4M8 20h8M9 16h6v4H9z"/></svg>
      <span>對獎</span>
    </button>
    <button data-tab="fixed" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v4h-4M20 12a8 8 0 0 1-14 5.3M4 20v-4h4"/></svg>
      <span>固定支出</span>
    </button>
    <button data-tab="report" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
      <span>報表</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
